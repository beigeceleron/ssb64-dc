# The checks that need no ROM (Phase 3). CI never holds the ROM:
# putting it in a secret, cache or artifact would be distributing it. The
# host tests, oracles and the Dreamcast build need one, so they are run
# locally with `./run.sh test` (see CONTRIBUTING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-rom:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Pulls the image .github/workflows/image.yml published for these
      # pins. If there is none (a pin just changed and image has not run
      # yet) this compiles the toolchain, which takes about an hour.
      - name: get the image
        run: ./run.sh image
      - name: checks
        run: ./run.sh test --ci
